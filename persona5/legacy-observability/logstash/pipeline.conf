input {
  beats { port => 5044 }
}

filter {
  # El job lo define cada input de Filebeat (ufw, postgres). Por compatibilidad, sin campo = ufw.
  if [fields][job] {
    mutate { add_field => { "job" => "%{[fields][job]}" } }
  } else {
    mutate { add_field => { "job" => "ufw" } }
  }
}

output {
  loki {
    url => "http://loki:3100/loki/api/v1/push"
    include_fields => ["job"]
  }
}

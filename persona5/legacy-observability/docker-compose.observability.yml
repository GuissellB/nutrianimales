services:
  loki:
    image: grafana/loki:3.4.2
    ports:
      - "127.0.0.1:3100:3100"
    networks: [nutrianimales-net]
    restart: unless-stopped

  logstash:
    build: ./observability/logstash
    environment:
      - XPACK_MONITORING_ENABLED=false
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./observability/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on: [loki]
    networks: [nutrianimales-net]
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/ufw.log:/var/log/ufw.log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [logstash]
    networks: [nutrianimales-net]
    restart: unless-stopped

networks:
  nutrianimales-net:
    external: true

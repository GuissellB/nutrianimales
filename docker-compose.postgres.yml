services:
  postgres-tls-init:
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/instalar-certificados.sh"]
    volumes:
      - postgres_tls_data:/tls
      - ./postgres/certs:/certs:ro
      - ./postgres/scripts:/scripts:ro
    restart: "no"

  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    depends_on:
      postgres-tls-init:
        condition: service_completed_successfully
    volumes:
      - postgres_tls_data:/tls:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl_min_protocol_version=TLSv1.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_tls_data:

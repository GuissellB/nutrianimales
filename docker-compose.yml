services:
  nginx:
    image: nginx:1.28-alpine
    container_name: nutrianimales-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - nutrianimales-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

  postgres:
    image: postgres:16-alpine
    container_name: nutrianimales-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nutrianimales-net
    security_opt:
      - no-new-privileges:true

networks:
  nutrianimales-net:
    name: nutrianimales-net
    driver: bridge

volumes:
  postgres_data:

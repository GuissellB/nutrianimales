# PostgreSQL 16: socket local con SCRAM, TCP solo con TLS + SCRAM.
# No se usa trust, md5 ni password. Primera coincidencia determina la regla.
# Los sockets Unix no usan TLS; requieren igualmente contrasena SCRAM.
# all no incluye conexiones de replicacion fisica; se rechazan por defecto.
# La exposicion de red se limita en Compose (5432 no publicado).
# Un futuro servicio debe usar postgres:5432, verificar el certificado y tener
# una cuenta propia con privilegios minimos. No montar /tls en clientes.

# TYPE      DATABASE      USER       ADDRESS          METHOD
local       replication   all                         reject
local       all           all                         scram-sha-256
hostssl     all           all        0.0.0.0/0         scram-sha-256
hostssl     all           all        ::/0              scram-sha-256
hostnossl   all           all        0.0.0.0/0          reject
hostnossl   all           all        ::/0               reject
